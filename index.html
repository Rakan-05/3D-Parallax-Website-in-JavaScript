<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive 3D Parallax Website</title>
    <script
      src="https://kit.fontawesome.com/b7ab9e1ea5.js"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <nav>
        <img src="img/logo.png" alt="logo" class="logo" />
        <ul>
          <li>
            <a href="#">Login</a>
          </li>
          <li><a href="#">Sign Up</a></li>
          <li class="search">
            <a href="#"><i class="fa-solid fa-magnifying-glass"></i></a>
          </li>
          <li class="hamburger">
            <a href="#">
              <div class="bar"></div>
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="vignette"></div>
      <img
        src="img/background.png"
        data-speedX="0.3"
        data-speedy="0.38"
        data-speedz="0"
        data-rotation="0"
        alt=""
        class="parallax bg-img"
      />
      <img
        src="img/fog_7.png"
        data-speedX="0.27"
        data-speedy="0.32"
        data-speedz="0"
        data-rotation="0"
        alt=""
        class="parallax fog-7"
      />
      <img
        src="img/mountain_10.png"
        data-speedX="0.195"
        data-speedy="0.305"
        data-speedz="0"
        data-rotation="0"
        alt=""
        class="parallax mountain_10"
      />
      <img
        src="img/fog_6.png"
        data-speedX="0.25"
        data-speedy="0.28"
        data-speedz="0"
        data-rotation="0"
        alt=""
        class="parallax fog-6"
      />
      <img
        src="img/mountain_9.png"
        data-speedX="0.125"
        data-speedy="0.155"
        data-speedz="0.15"
        data-rotation="0.02"
        alt=""
        class="parallax mountain_9"
      />
      <img
        src="img/mountain_8.png"
        data-speedX="0.1"
        data-speedy="0.11"
        data-speedz="0"
        data-rotation="0.02"
        alt=""
        class="parallax mountain_8"
      />
      <img
        src="img/fog_5.png"
        data-speedX="0.16"
        data-speedy="0.105"
        data-speedz="0"
        data-rotation="0"
        alt=""
        class="parallax fog-5"
      />
      <img
        src="img/mountain_7.png"
        data-speedX="0.1"
        data-speedy="0.1"
        data-speedz="0"
        data-rotation="0.09"
        alt=""
        class="parallax mountain_7"
      />

      <div
        class="text parallax"
        data-speedx="0.07"
        data-speedy="0.07"
        data-speedz="0"
        data-rotation="0.11"
      >
        <h2>China</h2>
        <h1>Zhanjiajie</h1>
      </div>

      <img
        src="img/mountain_6.png"
        data-speedx="0.065"
        data-speedy="0.05"
        data-speedz="0.05"
        data-rotation="0.03"
        alt=""
        class="parallax mountain_6"
      />
      <img
        src="img/fog_4.png"
        data-speedx="0.135"
        data-speedy="0.018"
        data-speedz="0"
        data-rotation="0"
        class="parallax fog-4"
      />
      <img
        src="img/mountain_5.png"
        data-speedx="0.08"
        data-speedy="0.0115"
        data-speedz="0.13"
        data-rotation="0.1"
        alt=""
        class="parallax mountain_5"
      />
      <img
        src="img/fog_3.png"
        data-speedx="0.11"
        data-speedy="0.013"
        data-speedz="0"
        data-rotation="0"
        class="parallax fog-3"
      />
      <img
        src="img/mountain_4.png"
        data-speedx="0.059"
        data-speedy="0.018"
        data-speedz="0"
        data-rotation="0.14"
        alt=""
        class="parallax mountain_4"
      />
      <img
        src="img/mountain_3.png"
        data-speedx="0.04"
        data-speedy="0.018"
        data-speedz="0.32"
        data-rotation="0.05"
        alt=""
        class="parallax mountain_3"
      />
      <img
        src="img/mountain_2.png"
        data-speedx="0.01"
        data-speedy="0.01"
        data-speedz="0"
        data-rotation="0"
        alt=""
        class="parallax mountain_2-2"
      />
      <img
        src="img/fog_2.png"
        data-speedx="0.0235"
        data-speedy="0.018"
        data-speedz="0"
        class="parallax fog-2"
      />
      <img
        src="img/mountain_2.png"
        data-speedx="0.027"
        data-speedy="0.023"
        data-speedz="0"
        data-rotation="0.15"
        alt=""
        class="parallax mountain_2"
      />
      <img
        src="img/mountain_1.png"
        data-speedx="0.027"
        data-speedy="0.123"
        data-speedz="0.53"
        data-rotation="0.2"
        alt=""
        class="parallax mountain_1"
      />
      <img src="img/sun_rays.png" alt="" class="sun-rays" />
      <img src="img/black_shadow.png" alt="" class="black-shadow" />
      <img
        src="img/fog_1.png"
        data-speedx="0.12"
        data-speedy="0.01"
        data-speedz="0"
        class="parallax fog-1"
      />
    </main>

    <script src="js/gsap.min.js"></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
